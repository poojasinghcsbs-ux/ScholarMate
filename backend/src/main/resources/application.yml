spring:
  application:
    name: scholarmate-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/scholarmate}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: ${PORT:8080}

# Frontend URL(s) to allow later when API controllers are added.
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://127.0.0.1:5500,http://localhost:5500}
